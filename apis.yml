aid: neuron-mobility
name: Neuron Mobility
description: Neuron Mobility is a rental e-scooter and e-bike operator and micromobility
  technology developer running shared micromobility fleets in cities across Australia,
  the United Kingdom, and Canada. The company designs its own vehicles (including the
  N3 e-scooter), safety systems such as its patented Helmet Lock and ScootSafe rider
  training program, and the backend fleet-management, IoT, and geofencing technology
  that powers its rider apps and city operations. Backed by 500 Global, Neuron was
  surfaced as a portfolio-company lead and profiled in the API Evangelist network.
  As of this enrichment pass the company publishes no first-party developer API, GBFS
  data feed, or well-known discovery surface on its own domain; this profile captures
  its public web, legal, and support properties plus a live domain-security probe.
